name: Import complete source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and rebuild Nexus source tree
        run: |
          set -euo pipefail
          test -f bootstrap/READY
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 \
            "https://files.catbox.moe/nn72tz.xz" \
            -o /tmp/nexus-source.tar.xz
          echo "db7a0f075d6f0641833dc263f80a44ed1a3a101becac8b6d25bc07426096e437  /tmp/nexus-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/nexus-source.tar.xz -C .
          chmod +x gradlew scripts/*.sh
          rm -rf bootstrap

      - name: Commit complete project
        run: |
          set -euo pipefail
          git config user.name "Nexus Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import completo sorgente Nexus Launcher 1.0.0"
          git push origin HEAD:main
